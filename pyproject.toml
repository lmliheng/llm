[project]
name = "supermodel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.1+cu128",
    "torchvision==0.22.1+cu128",
    "transformers==4.44.2",
    "accelerate==0.34.2",
    "peft==0.12.0",
    "datasets==2.21.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0,<5.0.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"